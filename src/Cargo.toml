[workspace]
resolver = "2"
members = ["crates/velqra-protocol", "crates/velqra-core", "crates/velqra-sim"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
proptest = "1"
tempfile = "3"
velqra-protocol = { path = "crates/velqra-protocol" }
velqra-core = { path = "crates/velqra-core" }
